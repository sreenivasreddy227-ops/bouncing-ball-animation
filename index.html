<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Fighter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="scene">

        <div class="title">
            <h1>ANIME FIGHTER</h1>
            <p>POWER UP</p>
        </div>

        <div class="fighter">

            <div class="aura"></div>

            <div class="head">
                <div class="hair"></div>

                <div class="face">
                    <div class="eye left-eye"></div>
                    <div class="eye right-eye"></div>
                </div>
            </div>

            <div class="body">

                <div class="arm left-arm"></div>
                <div class="arm right-arm"></div>

                <div class="chest"></div>

                <div class="leg left-leg"></div>
                <div class="leg right-leg"></div>

            </div>

        </div>

        <div class="energy energy1"></div>
        <div class="energy energy2"></div>
        <div class="energy energy3"></div>
        <div class="energy energy4"></div>
        <div class="energy energy5"></div>

        <button id="powerButton">⚡ POWER UP ⚡</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
